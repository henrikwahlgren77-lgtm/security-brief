services:
  security-brief:
    build: .
    container_name: security-brief
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/security_brief.sqlite3
    volumes:
      - brief_data:/data
    ports:
      - "127.0.0.1:8098:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  brief_data:
