{% extends "base.html" %}
{% block title %}{{ report.title }} · {{ app_name }}{% endblock %}
{% block content %}
  <a class="back-link" href="/">← Till översikten</a>
  <section class="report-header">
    <p class="eyebrow">SÄKERHETSBRIEF · NORRA EUROPA</p>
    <h1>{{ report.title }}</h1>
    <p class="muted">Publicerad {{ report.updated_at[:10] }}</p>
  </section>
  <article class="prose report-body">{{ report_html | safe }}</article>
{% endblock %}
